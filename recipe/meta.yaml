{% set name = "jaraco.functools" %}
{% set version = "4.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/jaraco_functools-{{ version }}.tar.gz
  sha256: da21933b0417b89515562656547a77b4931f98176eb173644c0d35032a33d6bb

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - setuptools_scm >=3.4.1
    - toml
    - setuptools >=77
    - setuptools-scm >=3.4.1
    - coherent.licensed
  run:
    - python
    - more-itertools
    - more_itertools
  run_constrained:
    - pytest-checkdocs >=2.4
    - pytest-enabler >=3.4
    - pytest-mypy >=1.0.1

test:
  source_files:
    - test_functools.py
  imports:
    - jaraco.functools
  requires:
    - pip
    - pytest
    - jaraco.classes
  commands:
    - pip check
    - pytest -vv test_functools.py -k "not test_function_throttled"

about:
  home: https://github.com/jaraco/jaraco.functools
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Additional functools in the spirit of stdlib's functools.
  doc_url: https://github.com/jaraco/jaraco.functools
  dev_url: https://github.com/jaraco/jaraco.functools

extra:
  recipe-maintainers:
    - carlodri
